services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: course
      POSTGRES_USER: app
      POSTGRES_PASSWORD: course_local_only
    ports:
      - "5432:5432"
    volumes:
      - course-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d course"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      DATABASE_URL: postgresql://app:course_local_only@db:5432/course?schema=public
      PORT: 3000
      NODE_ENV: development
      ALLOWED_WEB_ORIGINS: ${ALLOWED_WEB_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081}
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    command: >-
      sh -c "npm run db:migrate:deploy --workspace @course-app/api &&
      npm run start:prod --workspace @course-app/api"

volumes:
  course-postgres-data: